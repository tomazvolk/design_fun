<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Leaky</title>
  <meta name="description" content="A subscription tracker that finds your subscriptions in your inbox." />
  <meta name="theme-color" content="#f5f6f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Leaky" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="Leaky home">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5s-5 5.6-5 9a5 5 0 0 0 10 0c0-3.4-5-9-5-9Z" /></svg>
      <span>Leaky</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="topbar-end">
      <a class="btn btn-ghost back" href="/">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4" /></svg>
        <span>All prototypes</span>
      </a>
      <button class="btn btn-ghost menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" /></svg>
      </button>
    </div>
  </header>

  <main class="panel">
    <div class="content" id="view" tabindex="-1"></div>
    <p class="panel-note">Prototype. Inbox scanning is simulated with sample subscriptions, and nothing leaves this browser.</p>
  </main>

  <div id="overlay"></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
