<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Warranty tracker</title>
  <meta name="description" content="Keep every receipt and get reminded before a warranty or return window runs out." />
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Warranties" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* Set the theme before first paint so dark mode doesn't flash. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('warranty-tracker-next') || '{}');
        var t = (s.settings && s.settings.theme) || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <div class="frame">
    <header class="topbar" id="topbar" hidden></header>
    <div id="banner"></div>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

  <div id="overlay"></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
